# Smoke config: rl_backdoor under Krum that should match the fixed-action
# baseline. Three changes from the empty-window run that ended up running
# the static (1, 0, -1, 0) attack for 1000r:
#   1. ``rl_policy_train_end_round`` set explicitly (> attack_start_round)
#      so the TD3 trainer actually fires.
#   2. ``rl_backdoor_warmup_fixed_rollouts=200`` seeds the replay buffer with
#      the known-good default action before TD3 starts learning, so the
#      first gradient sees a successful-backdoor trajectory.
#   3. ``rl_backdoor_freeze_boost=5.0`` pins the boost action dim
#      (which is dead under the norm cap anyway) so the actor's capacity
#      and exploration noise go to the 3 dims that still matter.
# Shadow simulator is shrunk (5 clients × 100 samples) to keep each sim
# step ~1s on CPU; total wall ~60–80 min for the 300-round smoke.
data:
  dataset: mnist
  split_mode: paper_q
  noniid_q: 0.1

fl:
  num_clients: 100
  num_attackers: 20
  subsample_rate: 0.1
  local_epochs: 1

protocol:
  name: rlfl
  warmup_rounds: 30

runtime:
  rounds: 300
  device: auto
  lr: 0.01
  batch_size: 128
  eval_batch_size: 4096
  max_client_samples_per_client: 300
  max_eval_samples: 1000
  num_workers: 0
  parallel_clients: 1
  seed: 42

attacker:
  type: rl_backdoor
  rl_backdoor_default_action: [1.0, 0.0, -1.0, 0.0]
  rl_backdoor_stealth_norm_cap: true
  rl_backdoor_freeze_boost: 5.0
  rl_backdoor_warmup_fixed_rollouts: 200
  rl_backdoor_simulator_shadow_clients: 5
  rl_backdoor_simulator_shadow_samples_per_client: 100
  rl_backdoor_reward_mode: paper
  rl_algorithm: td3
  rl_attack_start_round: 31
  rl_policy_train_end_round: 100
  rl_policy_train_steps_per_round: 50
  rl_policy_lr: 3.0e-4
  rl_critic_lr: 3.0e-4
  rl_gamma: 1.0
  rl_replay_capacity: 200000
  rl_batch_size: 128
  rl_hidden_sizes: [256, 256]
  rl_exploration_noise: 0.05
  rl_train_freq_steps: 1
  rl_save_final_checkpoint: true

defender:
  type: krum
  krum_attackers: 20

output:
  output_root: fl_sandbox/outputs/rl_backdoor_normcap_smoke
  tb_root: fl_sandbox/runs/rl_backdoor_normcap_smoke
